{{- with site.Params.ads -}}
  {{- with .leftImage -}}
    {{- $img := resources.Get . -}}
    {{- if $img -}}
      <aside class="ad-float ad-float-left" data-ad-id="ad-left">
        <button class="ad-close" aria-label="关闭">×</button>
        <a href="{{ $.Site.Params.ads.leftLink | default '#' }}" target="_blank" rel="noopener noreferrer sponsored">
          <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="广告">
        </a>
      </aside>
    {{- end -}}
  {{- end -}}

  {{- with .rightImage -}}
    {{- $img := resources.Get . -}}
    {{- if $img -}}
      <aside class="ad-float ad-float-right" data-ad-id="ad-right">
        <button class="ad-close" aria-label="关闭">×</button>
        <a href="{{ $.Site.Params.ads.rightLink | default '#' }}" target="_blank" rel="noopener noreferrer sponsored">
          <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="广告">
        </a>
      </aside>
    {{- end -}}
  {{- end -}}

  <script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.ad-float').forEach(function (ad) {
    var btn = ad.querySelector('.ad-close');
    if (btn) {
      btn.addEventListener('click', function () {
        ad.style.display = 'none';
      });
    }
  });
});
</script>
{{- end -}}
